<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Report Card</title>

    <link rel="stylesheet" href="../css/report.css">
</head>

<body>

    <div class="report-card">

        <h1>Student Report Card</h1>

        <div class="student-info">
            <p>
                <strong>Hall Ticket:</strong>
                A7K29P
            </p>

            <p>
                <strong>Student Name:</strong>
                Rahul Sharma
            </p>

            <p>
                <strong>Class:</strong>
                12
            </p>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Subject</th>
                    <th>Marks</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td>Physics</td>
                    <td>85 / 100</td>
                </tr>

                <tr>
                    <td>Chemistry</td>
                    <td>78 / 100</td>
                </tr>

                <tr>
                    <td>Biology</td>
                    <td>91 / 100</td>
                </tr>

                <tr>
                    <td>Mathematics</td>
                    <td>88 / 100</td>
                </tr>
            </tbody>
        </table>

        <div class="summary">
            <p>
                <strong>Total:</strong>
                342 / 400
            </p>

            <p>
                <strong>Percentage:</strong>
                85.5%
            </p>

            <p>
                <strong>Result:</strong>
                <span class="pass">PASS</span>
            </p>
        </div>

    </div>

</body>
</html>
